name: Bug report
description: Something in SillyGit doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search the existing issues first.
        For security problems, use the private report link instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with ...
        2. Right-click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: SillyGit version
      description: The commit you're running (`git rev-parse --short HEAD` in your SillyGit checkout).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git version
      description: Output of `git --version`.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Errors from the terminal you started SillyGit from or the developer tools console, and screenshots if it's visual. Remove tokens and private paths first.
