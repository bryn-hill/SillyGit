name: Release

# Builds the installers and publishes them as a GitHub release. Push a tag
# like v0.1.0 whose version matches package.json, or run it by hand from the
# Actions tab (the tag is created at the chosen branch's tip if it doesn't
# exist yet). See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.0. Must match the version in package.json.
        required: true
        type: string

permissions:
  contents: read

# One release at a time per tag, and never cancel one halfway through uploading.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Same rules as ci.yml: the runner is Bryn's own Mac and the repo is public.
# Nothing here runs for pull requests, actions are pinned to commit SHAs,
# checkout leaves no token in .git/config and the workspace is wiped first.
# Only this job can write, and only to contents (the release and its tag).
#
# The Mac builds macOS (arm64 and x64) and Windows (x64). Linux isn't built:
# node-pty has no Linux prebuilds and compiling it needs a Linux machine.
# Builds go straight onto the release, never through upload-artifact.
jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Wipe what the last run left, even if it was cancelled.
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # The runner's launchd service starts with a bare PATH; gh comes from Homebrew.
      - name: Find gh
        run: |
          for dir in /opt/homebrew/bin /usr/local/bin; do
            [ -x "$dir/gh" ] && echo "$dir" >> "$GITHUB_PATH"
          done
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v gh >/dev/null || { echo "::error::gh is not installed on the runner (brew install gh)"; exit 1; }

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match package.json version $version; bump the version first"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # Signing is off until the MATCH_PASSWORD secret exists; see "Code
      # signing" in RELEASING.md. Without it the app is ad hoc signed
      # (identity '-'). With it, Fastlane Match installs the Developer ID
      # certificate from the private certificates repo into a throwaway
      # keychain and hands its path and identity to the packaging step.
      - name: Install the signing certificate
        id: signing
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ -z "$MATCH_PASSWORD" ]; then
            echo "No MATCH_PASSWORD secret, so this build is ad hoc signed"
            exit 0
          fi
          # macOS's own Ruby is too old for Fastlane; Homebrew's is keg-only.
          ruby_bin=/opt/homebrew/opt/ruby/bin
          [ -x "$ruby_bin/bundle" ] || { echo "::error::Homebrew Ruby is missing on the runner (brew install ruby)"; exit 1; }
          echo "$ruby_bin" >> "$GITHUB_PATH"
          export PATH="$ruby_bin:$PATH"
          # Gems live outside the workspace, which is wiped every run.
          {
            echo "BUNDLE_PATH=$HOME/.cache/sillygit-release/bundle"
            echo "BUNDLE_FROZEN=true"
            echo "LC_ALL=en_US.UTF-8"
            echo "LANG=en_US.UTF-8"
            echo "FASTLANE_SKIP_UPDATE_CHECK=1"
            echo "FASTLANE_HIDE_CHANGELOG=1"
          } | tee -a "$GITHUB_ENV" > "$RUNNER_TEMP/fastlane.env"
          set -a; . "$RUNNER_TEMP/fastlane.env"; set +a
          bundle install --quiet
          # `printf ... | base64 | gh secret set` stores base64's trailing
          # newline, which breaks the Authorization header git sends.
          MATCH_GIT_BASIC_AUTHORIZATION=$(printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | tr -d '[:space:]')
          export MATCH_GIT_BASIC_AUTHORIZATION
          # Fail with a clear message if the token can't read the certificates repo.
          if ! git -c "http.extraheader=Authorization: Basic $MATCH_GIT_BASIC_AUTHORIZATION" \
              ls-remote --heads https://github.com/bryn-hill/sillygit-certificates.git >/dev/null 2>&1; then
            # Describe the decoded secret's shape without printing any of it.
            creds=$(printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 -D 2>/dev/null || true)
            case "$creds" in
              *'<'*|*'>'*) echo "The decoded secret still contains < or >" ;;
              *:github_pat_*|*:ghp_*) echo "The decoded secret looks like user:token, so the token itself is refused (expired, revoked, or no access to the repo)" ;;
              *) echo "The decoded secret isn't user:github_pat_… (${#creds} characters)" ;;
            esac
            echo "::error::MATCH_GIT_BASIC_AUTHORIZATION can't read bryn-hill/sillygit-certificates: check the token hasn't expired and the secret is base64 of 'bryn-hill:<token>'"
            exit 1
          fi
          echo "fastlane=true" >> "$GITHUB_OUTPUT"
          SIGNING_KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"
          export SIGNING_KEYCHAIN_PASSWORD
          bundle exec fastlane mac ci_keychain

      # MAC_IDENTITY and CSC_KEYCHAIN come from the step above. Notarizing
      # also needs the App Store Connect API key secrets.
      - name: Package for macOS
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signing=()
          if [ -n "${MAC_IDENTITY:-}" ]; then
            signing=("-c.mac.identity=$MAC_IDENTITY" -c.mac.hardenedRuntime=true)
            if [ -n "$APPLE_API_KEY_P8" ]; then
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
              signing+=(-c.mac.notarize=true)
            else
              echo "::warning::No APPLE_API_KEY_P8 secret, so the app is signed but not notarized"
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
              signing+=(-c.mac.notarize=false)
            fi
          else
            unset APPLE_API_KEY_ID APPLE_API_ISSUER CSC_KEYCHAIN
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          unset APPLE_API_KEY_P8
          for arch in arm64 x64; do
            node scripts/release-sdk-binary.mjs darwin "$arch"
            npx electron-builder --mac --"$arch" --publish never "${signing[@]}"
          done

      # The NSIS installer needs wine to build off Windows, so it's only made
      # when the runner has wine (brew install --cask wine-stable). The zip
      # always is.
      - name: Package for Windows
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          [ -n "$WIN_CSC_LINK" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          targets=(zip)
          command -v wine >/dev/null && targets+=(nsis)
          node scripts/release-sdk-binary.mjs win32 x64
          npx electron-builder --win "${targets[@]}" --x64 --publish never

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 SillyGit-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Assets go onto a draft first, so a half-finished upload never shows up
      # as the latest release. Rerunning a release replaces its assets.
      - name: Publish the release
        run: |
          shopt -s nullglob
          assets=(dist/SillyGit-*.dmg dist/SillyGit-*.zip dist/SillyGit-*.exe dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            # The notes template says <version> where each file name has the version.
            sed "s/<version>/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "SillyGit $VERSION" --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" "${assets[@]}"
          fi
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json url --jq .url

      # Take the keychain and API key off the runner whatever happened above.
      - name: Remove signing material
        if: always() && steps.signing.outputs.fastlane == 'true'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          bundle exec fastlane mac ci_cleanup
