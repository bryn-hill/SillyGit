name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Jobs only read the repo. Anything that needs more asks for it per job.
permissions:
  contents: read

# There is one runner, so a newer push supersedes the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# The runner is Bryn's own Mac, and the repo is public. Pull requests from
# forks never run on it, approved or not: `if` skips them, and nothing here
# uses pull_request_target. Actions are pinned to commit SHAs (Renovate keeps
# them current), checkout leaves no token in .git/config, and every job
# starts by wiping the workspace, so nothing carries over from the last run.
jobs:
  commits:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      # Wipe what the last run left, even if it was cancelled.
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Every new commit on a pull request, or every pushed commit on main or dev.
      - name: Check commit messages
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="${RANGE#*..}" ;; esac
          git cat-file -e "${RANGE%%..*}" 2>/dev/null || RANGE="${RANGE#*..}~1..${RANGE#*..}"
          node scripts/commit-msg.mjs --range "$RANGE"

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      # Wipe what the last run left, even if it was cancelled.
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # The runner's own ~/.npm already persists between runs. Saving it
          # to the Actions cache uploaded all 2.8 GB of it and hit the timeout.
          package-manager-cache: false

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  # Full end-to-end suite, only for pull requests into main (promotions from
  # dev) and runs started by hand on main. main's ruleset requires this check,
  # so a promotion can't merge until it's green. Pushes to dev skip it, and so
  # does the push that lands a promotion on main, which this already tested.
  e2e:
    needs: test
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      # Wipe what the last run left, even if it was cancelled.
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci

      - name: End-to-end tests
        run: npm run test:e2e

      # Keep the report of a failed run on the runner, outside the workspace
      # (which the next run wipes): the account's artifact storage quota is
      # full, so the upload below can't be relied on. The last 10 are kept.
      # Open one with: npx playwright show-report ~/sillygit-e2e-reports/<run>
      - name: Keep the report on the runner
        if: failure()
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          [ -d playwright-report ] || exit 0
          reports="$HOME/sillygit-e2e-reports"
          mkdir -p "$reports"
          cp -R playwright-report "$reports/$RUN"
          ls -1t "$reports" | tail -n +11 | while read -r old; do rm -rf "${reports:?}/$old"; done
          echo "Report kept on the runner at $reports/$RUN"

      # The HTML report already holds the failed tests' traces, so test-results/
      # isn't uploaded too. A full quota mustn't hide the real failure.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3
